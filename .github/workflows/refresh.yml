name: Sync Data

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh if stale
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, datetime, subprocess, sys

          stale = True
          if os.path.exists("last_sync.txt"):
              try:
                  last = datetime.datetime.fromisoformat(open("last_sync.txt").read().strip())
                  age = datetime.datetime.now(datetime.timezone.utc) - last
                  stale = age.total_seconds() > 1800   # 超过30分钟算旧, 重新拉
                  print(f"last sync {age.total_seconds():.0f}s ago -> {'stale, refresh' if stale else 'fresh, skip'}")
              except Exception:
                  stale = True

          if stale:
              r = subprocess.run([sys.executable, "sync.py"], capture_output=True, text=True)
              print(r.stdout)
              print(r.stderr)
              if r.returncode != 0:
                  sys.exit(r.returncode)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xhzb_intl.m3u last_sync.txt README.md
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "sync $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin main
          fi
